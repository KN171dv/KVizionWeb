<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de cliente - KVizion</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header class="topo">
        <a href="menu.html" class="marca">KVizion</a>
        <div class="usuario">
            <span id="nomeUsuario"></span>
            <button type="button" id="btnSair" class="botao secundario pequeno">Sair</button>
        </div>
    </header>

    <nav class="menu" aria-label="Menu principal">
        <a href="menu.html">Início</a>
        <a href="venda.html">Nova venda</a>
        <a href="vendas.html">Vendas</a>
        <a href="orcamento.html">Novo orçamento</a>
        <a href="orcamentos.html">Orçamentos</a>
        <a href="clientes.html" class="ativo">Clientes</a>
        <a href="produtos.html">Produtos</a>
    </nav>

    <main class="conteudo">
        <h1 id="tituloPagina">Cadastro de cliente</h1>
        <p class="subtitulo">Os campos com * são obrigatórios.</p>

        <div id="mensagem" class="mensagem" role="alert"></div>

        <section class="cartao">
            <form id="formCliente" novalidate>
                <div class="campo">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" name="nome" maxlength="100">
                    <span class="erro-campo" id="erro-nome"></span>
                </div>

                <div class="campo">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco" maxlength="150">
                    <span class="erro-campo" id="erro-endereco"></span>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" name="telefone" maxlength="20" placeholder="(21) 99999-0000">
                    <span class="erro-campo" id="erro-telefone"></span>
                </div>

                <div class="acoes">
                    <button type="submit" id="btnSalvar" class="botao">Cadastrar</button>
                    <a href="clientes.html" class="botao secundario">Voltar para a lista</a>
                </div>
            </form>
        </section>
    </main>

    <footer class="rodape">KVizion - Projeto Integrador Senac</footer>

    <script src="js/api.js"></script>
    <script src="js/comum.js"></script>
    <script src="js/cliente-form.js"></script>
</body>
</html>
